services:
  # FastAPI server
  api:
    build: .
    ports:
      # Bind to localhost only; Cloudflare Tunnel should forward to this port
      - "127.0.0.1:8001:8000"
    volumes:
      - esp32_data:/app/data          # Persist images and database (named volume)
      - ./prompts:/app/prompts:ro     # System prompt (read-only)
    env_file:
      - .env
    restart: unless-stopped

  # Background worker
  worker:
    build: .
    command: python -m app.worker
    volumes:
      - esp32_data:/app/data
      - ./prompts:/app/prompts:ro
    env_file:
      - .env
    depends_on:
      - api
    restart: unless-stopped

volumes:
  esp32_data:

