services:
  # FastAPI server
  api:
    build: .
    ports:
      - "8000" # Expose internally for Caddy, not to host directly
    volumes:
      - ./data:/app/data
      - ./prompts:/app/prompts
    env_file:
      - .env
    environment:
      # Override config for production
      - BASE_URL=https://YOUR_DOMAIN.com
    restart: always

  # Background worker
  worker:
    build: .
    command: python -m app.worker
    volumes:
      - ./data:/app/data
      - ./prompts:/app/prompts
    env_file:
      - .env
    environment:
      - BASE_URL=https://YOUR_DOMAIN.com
    depends_on:
      - api
    restart: always

  # Caddy Reverse Proxy (Handles HTTPS)
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    restart: always

volumes:
  caddy_data:
  caddy_config:

